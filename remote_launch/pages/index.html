<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ROS 2 Remote Launcher</title>

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/xterm.css" />
  <script src="/xterm.js"></script>
  <script src="/addon-fit.js"></script>
  <script src="/main.js"></script>

</head>

<body>
  <div class="main-container">
    <div class="launch-content">
      <table>
        <thead>
          <tr>
            <th>Launch File</th>
            <th>Actions</th>
            <th>Progress</th>
          </tr>
        </thead>
        <tbody id="bringup_table"></tbody>
      </table>
      <table>
        <tr>
          <th>
            <button id="shutDownCleanBtn" disabled="true"
              onclick="if(confirm('Are you sure you want to stop all launches & the launch manager?')) cleanShutDownClicked();">
              Shut Down Launcher
            </button>
            <button id="restartImmediateBtn" style="display: none" disabled="true"
              onclick="if(confirm('ATTENTION! This kills the launch service and all running nodes WITHOUT CLEANUP!\n' +
                          'Close all running RVIZ/ros monitoring tools before pressing OK!'))
                          restartImmediateClicked();">
              Force Reset
            </button>
          </th>
          <th>
            <select name="launches" id="launches" onchange="launchSelected()" disabled="true"></select>
            &nbsp;&nbsp;
            <label class="log-default-label">
              <input type="checkbox" id="log-default-checkbox" checked="true" onchange="logByDefaultChanged()"/>
              Log by Default
            </label>
          </th>
        </tr>
        <tbody id="control_table"></tbody>
      </table>
      <div id="discovery-server-info" style="display: none">
        Zenoh Router:
        <span id="discovery-server-status">Unknown</span>
      </div>
      <div id="zombies"></div>
    </div>
    <div class="terminal-container" style="display: none">
      <div class="term-resize-bar"></div>
      <button class="termclose-btn">&times;</button>
      <div class="log-controls">
        <span class="log-title">Launch Log</span>
        <input id="log-search" type="search" placeholder="Search, or /regex/" spellcheck="false" autocomplete="off" />
        <span id="log-match-count"></span>
        <button id="log-prev" title="Previous match (Shift+Enter)">Prev</button>
        <button id="log-next" title="Next match (Enter)">Next</button>
        <label class="log-default-label"><input type="checkbox" id="log-only-matches" /> Only matches</label>
        <select id="log-level">
          <option value="0">All</option>
          <option value="1">Warn+</option>
          <option value="2">Errors</option>
        </select>
        <label class="log-default-label"><input type="checkbox" id="log-time" /> Time</label>
        <span class="log-launch-buttons">
          Launches:
          <button id="log-all" title="Show every launch in the log">All</button>
          <button id="log-none" title="Hide every launch from the log">None</button>
        </span>
        <button id="log-save" title="Download the lines currently shown">Save</button>
        <span id="log-line-count"></span>
      </div>
      <div id="terminal" class="terminal-view"></div>
    </div>
  </div>
  <button class="termopen-btn">
    <img class="termopen-icon" src="/terminal.png" />
    <span class="termopen-icon">Launch Log</span>
  </button>
</body>

</html>
